# sh run.sh creates config.toml and a persistent token in .env on first launch.
# Direct binary launches require PRICE_API_TOKEN in the environment (at least 24 characters).
bind = "0.0.0.0:25577"
data_directory = "data"
hypixel_base_url = "https://api.hypixel.net/"

request_timeout_secs = 15
# Total budget for one response, including retries and streamed body processing.
response_timeout_secs = 60
request_spacing_ms = 500
request_retries = 2
max_retry_delay_secs = 60

catalog_interval_secs = 21600
bazaar_interval_secs = 60
auction_interval_secs = 90
# Overlap page downloads while retaining one global request-spacing / Retry-After gate.
auction_page_concurrency = 4
round_timeout_secs = 180

stale_after_secs = 300
max_price_age_secs = 3600
max_restore_age_secs = 86400

max_response_bytes = 16777216
max_snapshot_bytes = 16777216
max_catalog_items = 15000
max_bazaar_products = 10000
max_auction_pages = 200
max_auctions = 200000
max_price_entries = 50000
max_nbt_encoded_bytes = 65536
max_nbt_decoded_bytes = 262144
max_query_concurrency = 16
